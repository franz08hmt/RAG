[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-hcmute"
version = "0.1.0"
description = "Experimental RAG PoC for traceable question answering over HCMUTE academic documents"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

