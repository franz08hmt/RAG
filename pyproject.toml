[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-hcmute"
version = "0.1.0"
description = "Experimental RAG PoC for traceable question answering over HCMUTE academic documents"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pymupdf>=1.24",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
dense = ["sentence-transformers>=3.0", "faiss-cpu>=1.8", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

